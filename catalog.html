<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог кросівок — STEPZONE</title>
<meta name="description" content="Каталог оригінальних кросівок: Nike, adidas, Jordan, New Balance, ASICS, Puma, Converse, Vans, Reebok, Salomon, On, HOKA. Фільтр за брендом, категорією, розміром і ціною.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f0f0f'/><text y='72' x='50' font-size='58' font-family='Arial' font-weight='bold' fill='%23fff' text-anchor='middle'>S</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header id="header"></header>

<div class="container">
  <nav class="crumbs">
    <a href="index.html">Головна</a><span>/</span><span>Каталог</span>
  </nav>

  <div class="page-head">
    <h1>Каталог кросівок</h1>
    <p>Оригінальні моделі дванадцяти світових брендів. Використовуйте фільтри, щоб швидко знайти свою пару.</p>
  </div>

  <div class="catalog">

    <!-- ФІЛЬТРИ -->
    <aside class="filters">
      <div class="filters__head" style="display:none">
        <h3>Фільтри</h3>
        <button class="icon-btn" type="button" id="filtersClose" aria-label="Закрити">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="fgroup">
        <button class="fgroup__title" type="button">Пошук
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="fgroup__body">
          <input type="search" id="searchInput" placeholder="Назва або бренд…"
                 style="height:44px;border-radius:10px;border:1.5px solid var(--line);padding:0 14px;outline:none">
        </div>
      </div>

      <div class="fgroup">
        <button class="fgroup__title" type="button">Бренд
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="fgroup__body" id="fBrands"></div>
      </div>

      <div class="fgroup">
        <button class="fgroup__title" type="button">Категорія
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="fgroup__body" id="fCats"></div>
      </div>

      <div class="fgroup">
        <button class="fgroup__title" type="button">Розмір (EU)
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="fgroup__body"><div class="sizes" id="fSizes"></div></div>
      </div>

      <div class="fgroup">
        <button class="fgroup__title" type="button">Ціна, ₴
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="fgroup__body">
          <div class="range">
            <input type="number" id="priceMin" placeholder="від 3000" min="0" step="100" aria-label="Ціна від">
            <span class="muted">—</span>
            <input type="number" id="priceMax" placeholder="до 13000" min="0" step="100" aria-label="Ціна до">
          </div>
        </div>
      </div>

      <div class="fgroup">
        <button class="fgroup__title" type="button">Для кого
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="fgroup__body" id="fGender"></div>
      </div>

      <div class="fgroup">
        <button class="fgroup__title" type="button">Позначки
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="fgroup__body" id="fBadges"></div>
      </div>

      <button class="btn btn--ghost btn--block" type="button" id="resetBtn" style="margin-top:18px">Скинути всі фільтри</button>
      <button class="btn btn--primary btn--block filters-toggle" type="button" id="filtersApply" style="margin-top:8px">Показати результати</button>
    </aside>

    <!-- РЕЗУЛЬТАТИ -->
    <div>
      <div class="toolbar">
        <button class="btn btn--ghost btn--sm filters-toggle" type="button" id="filtersOpen">
          ☰ Фільтри
        </button>
        <span class="toolbar__count" id="resultCount">Завантаження…</span>
        <span class="toolbar__count muted small" id="shownInfo"></span>
        <select id="sortSelect" style="margin-left:auto" aria-label="Сортування">
          <option value="popular">Спочатку популярні</option>
          <option value="new">Спочатку новинки</option>
          <option value="price-asc">Ціна: від дешевих</option>
          <option value="price-desc">Ціна: від дорогих</option>
          <option value="rating">За рейтингом</option>
          <option value="discount">За розміром знижки</option>
          <option value="name">За назвою (А–Я)</option>
        </select>
      </div>

      <div class="chips-row">
        <div class="chips" id="activeChips" hidden></div>
        <button class="link-del" type="button" id="clearAllChips" hidden>✕ Скинути все</button>
      </div>

      <div class="grid-products grid-products--3" id="catalogGrid"></div>

      <div class="center" style="margin-top:36px">
        <button class="btn btn--ghost btn--lg" type="button" id="loadMore" hidden>Показати ще</button>
      </div>
    </div>

  </div>
</div>

<footer id="footer"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/catalog.js"></script>
</body>
</html>
